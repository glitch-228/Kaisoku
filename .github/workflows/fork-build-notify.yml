name: Fork build notify

# Notifies the CI fork (Ruslik31/Kaisoku) on every unstable push so it can
# build fresh debug and release APKs from upstream code. Skips gracefully
# when no dispatch token is configured.
on:
  push:
    branches:
      - unstable

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the fork build
        env:
          TOKEN: ${{ secrets.FORK_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No FORK_DISPATCH_TOKEN secret configured, skipping fork notification."
            exit 0
          fi

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.github.com/repos/Ruslik31/Kaisoku/dispatches" \
            -d "{\"event_type\":\"source_pushed\",\"client_payload\":{\"repo\":\"glitch-228/Kaisoku\",\"ref\":\"${GITHUB_SHA}\"}}")
          echo "Dispatch response: ${STATUS}"

          if [ "$STATUS" != "204" ]; then
            echo "::warning::Fork dispatch failed with ${STATUS} — the fork build was not triggered."
          fi
