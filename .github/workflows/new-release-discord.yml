name: Discord Release Webhook

on:
  release:
    # 'published' fires exactly once per release (prereleases included — the jobs branch on the
    # prerelease flag). Do NOT add 'edited': attaching a release asset fires a follow-up 'edited'
    # event, so publishing with an APK would post to Discord twice. Re-post a failed run via the
    # Actions UI -> Re-run jobs.
    types: [published]

jobs:
  releaseNotification:
    if: ${{ github.event.release.prerelease == false }}
    name: Notify Discord - New Release
    runs-on: ubuntu-latest
    steps:
      - name: Send release embed to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_RELEASE_ROLE_ID || secrets.DISCORD_ROLE_ID }}
          REPO_FULL_NAME: ${{ github.repository }}
          REPO: ${{ github.event.repository.name }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
          ACTOR: ${{ github.actor }}
          TIMESTAMP: ${{ github.event.release.published_at }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No DISCORD_RELEASE_WEBHOOK secret configured, skipping notification."
            exit 0
          fi

          DEFAULT_ROLE_ID="1506992583744684175"
          ROLE_ID="$DISCORD_ROLE_ID"
          if [ -z "$ROLE_ID" ] && [ "$REPO_FULL_NAME" = "glitch-228/Kaisoku" ]; then
            ROLE_ID="$DEFAULT_ROLE_ID"
          fi

          CONTENT=""
          ROLE_MENTIONS="[]"
          if [ -n "$ROLE_ID" ]; then
            CONTENT="<@&${ROLE_ID}>"
            ROLE_MENTIONS="[\"${ROLE_ID}\"]"
          fi

          # Discord caps embed description at 4096 chars; release notes can grow past that.
          DESC="${BODY}"
          if [ ${#DESC} -gt 3800 ]; then
            DESC="${DESC:0:3800}"$'\n\n'"…(truncated; open the release for full notes)"
          fi
          jq -n \
            --arg content "$CONTENT" \
            --argjson roles "$ROLE_MENTIONS" \
            --arg title "🚀 New Release: ${REPO} v${TAG}" \
            --arg url "${URL}" \
            --arg description "${DESC}" \
            --arg author_name "${ACTOR}" \
            --arg author_icon "https://github.com/${ACTOR}.png" \
            --arg footer "Release published on main" \
            --arg timestamp "${TIMESTAMP}" \
            '{
              content: $content,
              allowed_mentions: { roles: $roles },
              embeds: [{
                title: $title,
                url: $url,
                description: $description,
                color: 3447003,
                author: { name: $author_name, icon_url: $author_icon },
                footer: { text: $footer },
                timestamp: $timestamp
              }]
            }' | curl -fsS -H "Content-Type: application/json" -X POST -d @- "$WEBHOOK"

  prereleaseNotification:
    if: ${{ github.event.release.prerelease == true }}
    name: Notify Discord - Pre-Release
    runs-on: ubuntu-latest
    steps:
      - name: Send prerelease embed to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_RELEASE_ROLE_ID || secrets.DISCORD_ROLE_ID }}
          REPO_FULL_NAME: ${{ github.repository }}
          REPO: ${{ github.event.repository.name }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
          ACTOR: ${{ github.actor }}
          TIMESTAMP: ${{ github.event.release.published_at }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No DISCORD_RELEASE_WEBHOOK secret configured, skipping notification."
            exit 0
          fi

          ROLE_ID="$DISCORD_ROLE_ID"

          CONTENT=""
          ROLE_MENTIONS="[]"
          if [ -n "$ROLE_ID" ]; then
            CONTENT="<@&${ROLE_ID}>"
            ROLE_MENTIONS="[\"${ROLE_ID}\"]"
          fi

          DESC="${BODY}"
          if [ ${#DESC} -gt 3800 ]; then
            DESC="${DESC:0:3800}"$'\n\n'"…(truncated; open the release for full notes)"
          fi
          jq -n \
            --arg content "$CONTENT" \
            --argjson roles "$ROLE_MENTIONS" \
            --arg title "🧪 Pre-Release: ${REPO} ${TAG}" \
            --arg url "${URL}" \
            --arg description "${DESC}" \
            --arg author_name "${ACTOR}" \
            --arg author_icon "https://github.com/${ACTOR}.png" \
            --arg footer "Pre-release build" \
            --arg timestamp "${TIMESTAMP}" \
            '{
              content: $content,
              allowed_mentions: { roles: $roles },
              embeds: [{
                title: $title,
                url: $url,
                description: $description,
                color: 15105570,
                author: { name: $author_name, icon_url: $author_icon },
                footer: { text: $footer },
                timestamp: $timestamp
              }]
            }' | curl -fsS -H "Content-Type: application/json" -X POST -d @- "$WEBHOOK"
