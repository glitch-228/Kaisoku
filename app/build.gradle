// ---- Telegram backup token seal --------------------------------------------
//
// The default Telegram bot token is read from the git-ignored `local.properties`
// (`tg_backup_bot_token`) and sealed into a per-build `TokenData.kt` written to
// `build/generated/kaisokuToken`. Each build draws a fresh CSPRNG key, nonce and
// app tag, so every release carries different ciphertext ("time" rotation); the
// app tag is bound into the GCM AAD so the envelope is tied to this app + build
// and is tamper-detected (the "identifier" factor). When no token is configured
// the generated file ships ENABLED=false and the feature stays off.
//
// This is deliberately only *obfuscation*: AES-GCM keeps the plaintext out of the
// binary as a scan-able constant, but the key material ships in the same APK, so a
// determined reverse engineer can recover it. It is not a substitute for per-user
// tokens (stored in encrypted prefs). Keep this contract IDENTICAL in
// `src/main/kotlin/.../core/security/TokenSeal.kt`:
//   - key     = 32 bytes (AES-256)
//   - nonce   = 12 bytes
//   - tag     = 128 bits ("AES/GCM/NoPadding")
//   - aad     = "org.koitharu.kotatsu.backup:" + appTag (UTF-8)
//   - keyParts = 4 x 8-byte split of the 32-byte key

def utf8 = { String s -> s.getBytes('UTF-8') }
def byteArrayLiteral = { byte[] b ->
	if (b.length == 0) return 'byteArrayOf()'
	'byteArrayOf(' + b.collect { it.toString() }.join(', ') + ')'
}
def seal = { byte[] key, byte[] nonce, String appTag, byte[] plain ->
	def cipher = Cipher.getInstance('AES/GCM/NoPadding')
	cipher.init(Cipher.ENCRYPT_MODE, new SecretKeySpec(key, 'AES'), new GCMParameterSpec(128, nonce))
	cipher.updateAAD(utf8("org.koitharu.kotatsu.backup:${appTag}"))
	return cipher.doFinal(plain)
}
def unseal = { byte[] key, byte[] nonce, String appTag, byte[] ct ->
	def cipher = Cipher.getInstance('AES/GCM/NoPadding')
	cipher.init(Cipher.DECRYPT_MODE, new SecretKeySpec(key, 'AES'), new GCMParameterSpec(128, nonce))
	cipher.updateAAD(utf8("org.koitharu.kotatsu.backup:${appTag}"))
	return new String(cipher.doFinal(ct), 'UTF-8')
}

def tokenGenDir = file("${buildDir}/generated/kaisokuToken")

tasks.register('generateTokenSeal') {
	description = 'Seal the Telegram backup token into build/generated/kaisokuToken/TokenData.kt'
	def generatedFile = new File(tokenGenDir, 'TokenData.kt')
	inputs.file(rootProject.file('local.properties'))
	outputs.file generatedFile
	doLast {
		def props = new Properties()
		def propsFile = rootProject.file('local.properties')
		if (propsFile.exists()) {
			propsFile.withInputStream { props.load(it) }
		}
		def plainToken = props.getProperty('tg_backup_bot_token')?.trim() ?: ''
		def enabled = !plainToken.isEmpty()

		String content
		if (enabled) {
			def rng = new SecureRandom()
			byte[] key = new byte[32]; rng.nextBytes(key)
			byte[] nonce = new byte[12]; rng.nextBytes(nonce)
			String appTag = new BigInteger(64, rng).toString(16)
			byte[] ct = seal(key, nonce, appTag, utf8(plainToken))

			// Self-test: the Groovy side must round-trip before emitting the file.
			def check = unseal(key, nonce, appTag, ct)
			if (check != plainToken) {
				throw new GradleException('TokenSeal self-test failed: round-trip mismatch')
			}

			def parts = []
			for (int i = 0; i < 4; i++) {
				parts << byteArrayLiteral(Arrays.copyOfRange(key, i * 8, (i + 1) * 8))
			}
			content = """\
package org.koitharu.kotatsu.core.security

// GENERATED by the generateTokenSeal task - do not edit.
// The default Telegram backup token, sealed with AES-256-GCM under a per-build key.
// ENABLED is false when no token was configured at build time.
internal object TokenData {

	internal const val ENABLED: Boolean = true

	internal const val appTag: String = "${appTag}"

	// 32-byte AES-256 key split into 4 x 8-byte parts (defeats plain constant scans).
	internal val keyParts: List<ByteArray> = listOf(
		${parts[0]},
		${parts[1]},
		${parts[2]},
		${parts[3]},
	)

	internal val nonce: ByteArray = ${byteArrayLiteral(nonce)}

	internal val ciphertext: ByteArray = ${byteArrayLiteral(ct)}
}
"""
		} else {
			content = """\
package org.koitharu.kotatsu.core.security

// GENERATED by the generateTokenSeal task - do not edit.
internal object TokenData {

	internal const val ENABLED: Boolean = false

	internal const val appTag: String = ""

	internal val keyParts: List<ByteArray> = emptyList()

	internal val nonce: ByteArray = byteArrayOf()

	internal val ciphertext: ByteArray = byteArrayOf()
}
"""
		}
		tokenGenDir.mkdirs()
		generatedFile.text = content
		println 'TokenSeal: sealed Telegram backup token into generated source'
	}
}

android {
	compileSdk = 36
	buildToolsVersion = '35.0.0'
	namespace = 'org.koitharu.kotatsu'

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    defaultConfig {
		applicationId 'io.github.glitch228.kaisoku'
		minSdk = 26
		targetSdk = 36
		versionCode = 2074
		versionName = '9.8.6-beta3'
		generatedDensities = []
		testInstrumentationRunner 'org.koitharu.kotatsu.HiltTestRunner'
		ksp {
			arg('room.generateKotlin', 'true')
		}
		androidResources {
			// https://issuetracker.google.com/issues/408030127
			generateLocaleConfig false
		}
		// The default Telegram backup bot token is NOT added as a resource here. It is sealed by
		// the `generateTokenSeal` task into the generated TokenData.kt (see above) so the plaintext
		// never appears as a res string in the APK. An empty default keeps the feature disabled
		// until a token is configured in the git-ignored local.properties.
	}
	buildTypes {
		debug {
			applicationIdSuffix = '.debug'
		}
		release {
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
		nightly {
			initWith release
			applicationIdSuffix = '.nightly'
		}
	}
	buildFeatures {
		viewBinding true
		buildConfig true
	}
	packagingOptions {
		jniLibs {
			useLegacyPackaging true
		}
		resources {
			excludes += [
				'META-INF/README.md',
				'META-INF/NOTICE.md'
			]
		}
	}
	sourceSets {
		androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
		main.java.srcDirs += 'src/main/kotlin/'
		// Generated sealed-token constants become part of the app source.
		main.java.srcDirs += tokenGenDir
	}
	compileOptions {
		coreLibraryDesugaringEnabled true
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	kotlinOptions {
		jvmTarget = JavaVersion.VERSION_17.toString()
		freeCompilerArgs += [
			'-opt-in=kotlin.ExperimentalStdlibApi',
			'-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
			'-opt-in=kotlinx.coroutines.ExperimentalForInheritanceCoroutinesApi',
			'-opt-in=kotlinx.coroutines.InternalForInheritanceCoroutinesApi',
			'-opt-in=kotlinx.coroutines.FlowPreview',
			'-opt-in=kotlin.contracts.ExperimentalContracts',
			'-opt-in=coil3.annotation.ExperimentalCoilApi',
			'-opt-in=coil3.annotation.InternalCoilApi',
			'-opt-in=kotlinx.serialization.ExperimentalSerializationApi',
			'-Xjspecify-annotations=strict',
			'-Xannotation-default-target=first-only',
			'-Xtype-enhancement-improvements-strict-mode'
		]
	}
	room {
        schemaDirectory "$projectDir/schemas"
	}
	lint {
		abortOnError true
		disable 'MissingTranslation', 'PrivateResource', 'SetJavaScriptEnabled', 'SimpleDateFormat'
	}
	testOptions {
		unitTests.includeAndroidResources true
		unitTests.returnDefaultValues false
		kotlinOptions {
			freeCompilerArgs += ['-opt-in=org.koitharu.kotatsu.parsers.InternalParsersApi']
		}
	}
	applicationVariants.configureEach { variant ->
		if (variant.name == 'nightly') {
			variant.outputs.each { output ->
				def now = LocalDateTime.now()
				output.versionCodeOverride = now.format("yyMMdd").toInteger()
				output.versionNameOverride = 'N' + now.format("yyyyMMdd")
			}
		}
	}
}

preBuild.dependsOn tasks.named('generateTokenSeal')

